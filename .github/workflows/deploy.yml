name: Validate, build, publish and deploy

on:
  push:
    branches: [qa, main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deployment-droplet
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate website and deployment script
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          grep -qi '<html' index.html
          grep -q 'Website Version' index.html
          test -s Dockerfile
          test -s deploy/Caddyfile
          bash -n deploy/deploy.sh
          echo 'Validation successful'

      - name: Select image tag and environment
        shell: bash
        run: |
          set -euo pipefail
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF_NAME" == "qa" ]]; then
            echo 'DEPLOY_ENV=qa' >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF_NAME" == "main" ]]; then
            echo 'DEPLOY_ENV=prod' >> "$GITHUB_ENV"
          else
            echo 'Unexpected branch' >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Set up verified SSH access
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" 'docker version >/dev/null'

      - name: Pull image and deploy on Droplet
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          set -euo pipefail
          target="$DEPLOY_USER@$DEPLOY_HOST"
          ssh_opts=(-i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o BatchMode=yes)
          scp "${ssh_opts[@]}" deploy/deploy.sh "$target:deploy.sh"
          printf '%s' "$REGISTRY_TOKEN" | ssh "${ssh_opts[@]}" "$target" \
            "docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin"
          trap 'ssh "${ssh_opts[@]}" "$target" "docker logout ghcr.io" >/dev/null 2>&1 || true' EXIT
          ssh "${ssh_opts[@]}" "$target" \
            "chmod 700 ~/deploy.sh && ~/deploy.sh '$DEPLOY_ENV' '$IMAGE'"
