<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DigitalOcean Practical Test</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101827; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    main { width: min(90vw, 620px); padding: 48px; border: 1px solid #364255; border-radius: 22px; background: #182337; text-align: center; box-shadow: 0 18px 55px #0005; }
    .pill { display: inline-block; padding: 7px 12px; color: #9ee5cf; background: #18463b; border-radius: 100px; font-weight: 700; font-size: 13px; }
    h1 { font-size: clamp(28px, 5vw, 46px); margin: 24px 0 10px; }
    p { color: #cad6e5; line-height: 1.6; }
    .version { margin-top: 30px; color: #9ee5cf; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <div class="pill">Docker + GitHub Actions</div>
    <h1>DigitalOcean Practical Test</h1>
    <p>Secure, automatic CI/CD deployment with separate QA and production environments.</p>
    <p class="version">Website Version 1</p>
  </main>
</body>
</html>
